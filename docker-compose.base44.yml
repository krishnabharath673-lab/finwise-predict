services:
  web:
    image: node:22
    working_dir: /app
    ports:
      - "3000:8080"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CI=true
    command:
      ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 8080"]
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:8080/ | grep -q 'id=\"root\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s
    restart: on-failure

volumes:
  web_node_modules:
